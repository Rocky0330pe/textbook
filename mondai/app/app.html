<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 読みこんでよいものの出どころを制限する（外のサーバーのスクリプトは読まない。書体は中に入れてある） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習プリント（物理を理解するための数学 問題集）</title>
<style>
/*FONT*/
:root { --theme: #ef4134; --deep: #b3261e; --ink: #222; --gray: #666; --line: #bbb; --paper: #fff; --bg: #f4f4f2; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "MQKlee", "Klee One", "UD デジタル 教科書体 N-R", "BIZ UDGothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif; }
.panel { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 16px; }
.ctrl { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ctrl h1 { font-size: 18px; margin: 0 0 6px; color: var(--deep); }
.ctrl p.lead { margin: 0 0 10px; font-size: 13px; color: var(--gray); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 8px 0; }
.row label { font-size: 14px; }
input[type=text], input[type=number], select { font: inherit; font-size: 15px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
#ids { width: 100%; }
#count, #seed { width: 7em; }
button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--deep); background: #fff; color: var(--deep); cursor: pointer; }
button.main { background: var(--theme); border-color: var(--theme); color: #fff; font-weight: bold; }
#msg { color: var(--deep); font-size: 13px; min-height: 1em; }
.catalog { background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-height: 70vh; overflow: auto; font-size: 13px; }
.catalog h3 { font-size: 14px; margin: 10px 0 4px; color: var(--deep); }
.catalog ul { list-style: none; padding: 0; margin: 0; }
.catalog li { margin: 2px 0; }
.catalog .pick { font-size: 12px; padding: 1px 6px; min-width: 3.6em; }
.star { color: #e48a00; }
#sheets { padding: 0 0 40px; }
.empty { text-align: center; color: var(--gray); }
/* A4 のプリント */
.sheet { width: 210mm; min-height: 297mm; margin: 12px auto; background: var(--paper); padding: 13mm 14mm 12mm; box-shadow: 0 2px 8px rgba(0,0,0,.15); position: relative; display: flex; flex-direction: column; }
.head { border-bottom: 2px solid var(--theme); padding-bottom: 3mm; margin-bottom: 4mm; display: grid; grid-template-columns: 1fr auto; gap: 1mm 6mm; }
.head .ttl { font-size: 17pt; font-weight: bold; display: flex; align-items: center; gap: 3mm; flex-wrap: wrap; }
.head .chip { background: var(--theme); color: #fff; border-radius: 3mm; padding: 1mm 3mm; font-size: 13pt; white-space: nowrap; }
.head .kind { border: 1.5px solid var(--deep); color: var(--deep); border-radius: 2mm; padding: 0.5mm 2.5mm; font-size: 11pt; }
.head .meta { font-size: 11pt; display: flex; gap: 5mm; align-items: flex-end; }
.head .line { display: inline-block; width: 40mm; border-bottom: 1px solid var(--ink); margin: 0 1mm; height: 1.2em; }
.head .line.short { width: 9mm; }
.head .sub { grid-column: 1 / -1; font-size: 9pt; color: var(--gray); }
.note { font-size: 11pt; margin: 0 0 3mm; }
ol.probs { margin: 0; padding: 0; list-style: none; counter-reset: q; flex: 1; font-size: 17pt; }
ol.probs li { counter-increment: q; display: flex; align-items: center; break-inside: avoid; }
ol.probs li::before { content: "(" counter(q) ")"; font-size: 10pt; color: var(--gray); width: 10mm; flex: none; }
ol.probs.two { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 17.2mm; column-gap: 8mm; grid-auto-flow: column; grid-template-rows: repeat(12, 17.2mm); }
ol.probs.one li { min-height: 18.5mm; }
ol.probs li.long { font-size: 13pt; line-height: 1.35; }
.box { display: inline-block; min-width: 15mm; height: 10mm; border: 1.6px solid var(--theme); border-radius: 1.5mm; vertical-align: middle; margin: 0 1mm; }
.sq { display: inline-block; width: 0.8em; height: 0.8em; border: 1px solid currentColor; vertical-align: -0.05em; }
.box.sm { min-width: 13mm !important; height: 8mm; }
.wz { margin-left: auto; font-size: 9pt; color: var(--gray); white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.8em; line-height: 1.05; margin: 0 0.15em; }
.frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.2em; }
b.mk { text-decoration: underline; }
ruby rt { font-size: 0.45em; }
.foot { font-size: 8.5pt; color: var(--gray); border-top: 1px solid var(--line); padding-top: 2mm; margin-top: 3mm; }
.box.filled { color: var(--deep); font-weight: bold; text-align: center; padding: 0 1.5mm; line-height: 10mm; width: auto; }
.ansout { color: var(--deep); margin-left: 2mm; }
ol.probs.withhow { font-size: 15pt; }
ol.probs.two.withhow { grid-template-rows: repeat(12, 15.6mm); grid-auto-rows: 15.6mm; }
ol.probs.one.withhow li { min-height: 16.5mm; }
ol.probs.withhow li { flex-wrap: wrap; align-content: center; }
ol.probs.withhow .box { height: 8.5mm; }
.box.filled { line-height: 8.5mm !important; }
.how { flex-basis: 100%; padding-left: 10mm; font-size: 9pt; color: var(--gray); line-height: 1.2; margin-top: 0.5mm; }
ol.probs.one.withhow li .how { padding-left: 10mm; }
.wz.ansz { color: var(--deep); font-weight: bold; font-size: 10pt; }
.summary { display: flex; flex-wrap: wrap; gap: 1mm 6mm; border: 1px solid var(--line); border-radius: 2mm; padding: 1.5mm 3mm; margin: 0 0 2mm; font-size: 9pt; line-height: 1.35; }
.summary .chip { background: var(--theme); color: #fff; border-radius: 2mm; padding: 0 2mm; font-size: 9pt; }
.summary .raku { color: var(--ink); margin: 0.5mm 0 0 2mm; }
.answers .head { border-bottom-color: var(--deep); }
.hsflow { display: flex; flex-wrap: wrap; gap: 6mm; align-content: flex-start; flex: 1; }
.hsi { font-size: 15pt; }
.hsi .n { font-size: 10pt; color: var(--gray); }
.hsi svg.hs { display: block; margin-top: 1mm; font-family: inherit; }
.hsi .how { font-size: 9pt; color: var(--gray); }
.hsi.txt { display: flex; flex-wrap: wrap; align-items: center; gap: 1mm; }
@media (max-width: 860px) { .panel { grid-template-columns: 1fr; } .sheet { transform-origin: top left; } }
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff; }
  .panel { display: none; }
  #sheets { padding: 0; }
  .sheet { margin: 0; box-shadow: none; width: 210mm; height: 297mm; min-height: 0; page-break-after: always; break-after: page; }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
  body[data-print="q"] .sheet.answers, body[data-print="a"] .sheet.questions { display: none; }
}
</style>
</head>
<body>
<div class="panel">
  <form class="ctrl" onsubmit="return false">
    <h1>練習プリントを作る</h1>
    <p class="lead">『物理を理解するための数学 問題集』の「わざ」の番号を入れると、そのわざの問題の A4 プリントと、こたえと とき方（楽な形）のプリントができます。いま入っているわざ：<span id="nwaza"></span>こ。</p>
    <div class="row"><label>巻 <select id="vol"></select></label>
      <label>プリントの題（なくてもよい） <input type="text" id="title" placeholder="わざの名前が入ります"></label></div>
    <div class="row"><label style="width:100%">わざの番号<br><input type="text" id="ids" placeholder="例：1-37　／ 37　／ 33〜40　／ 2, 7, 37" autocomplete="off"></label></div>
    <div class="row">
      <label>問題の数 <input type="number" id="count" value="20" min="1" max="120"></label>
      <label><input type="checkbox" id="st-s1" checked> ステップ1</label>
      <label><input type="checkbox" id="st-s2" checked> ステップ2</label>
      <label><input type="checkbox" id="st-s3" checked> ステップ3</label>
      <label><input type="checkbox" id="st-trap"> わな</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="mix"> まぜる（見分ける練習：わざの番号を書く欄つき）</label>
      <label><input type="checkbox" id="ruby" checked> ふりがな</label>
    </div>
    <div class="row">
      <label>たねの番号 <input type="number" id="seed" min="1"></label>
      <button type="button" id="dice">べつの問題にする</button>
      <span style="font-size:12px;color:#666">同じ番号なら、同じプリントになります。</span>
    </div>
    <div class="row"><button type="button" class="main" id="make">プリントを作る</button>
      <button type="button" id="print">問題と こたえを 印刷（A4）</button>
      <button type="button" id="printq">問題だけ</button>
      <button type="button" id="printa">こたえだけ</button></div>
    <p class="lead" style="margin-top:6px">プリントを作ると、問題のプリントと、同じならびの「こたえと とき方」のプリントが、いっしょにできます。</p>
    <div id="msg"></div>
  </form>
  <div class="catalog"><b>わざの一覧</b>（番号をおすと、入ります）<div id="catalog"></div></div>
</div>
<main id="sheets"></main>
<script>
/*SCRIPTS*/
</script>
</body>
</html>
